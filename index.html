		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<script>
// Startup profiler (build step 1 diagnostics). Times WebGL calls, and each
// shader program's compile and link, per stage of the startup probe
// (scripts/debug/startup_probe.gd), and counts programs never used to draw.
// The debug overlay reads its totals. Written without double quotes or
// backslashes so it can sit verbatim in export_presets.cfg.
(() => {
	const Gl2 = window.WebGL2RenderingContext;
	if (!Gl2 || window.startupProfiler) {
		return;
	}
	const NEWLINE = String.fromCharCode(10);
	const VERTEX_SHADER = 0x8B31;
	const DRAW_CALLS = ['drawArrays', 'drawElements', 'drawArraysInstanced', 'drawElementsInstanced', 'drawRangeElements'];
	const keepSource = new URLSearchParams(location.search).has('glsource');
	const records = new WeakMap(); // WebGLShader or WebGLProgram -> its record
	const programs = [];
	const stages = [];
	const methods = {};
	const totals = { programs: 0, programMs: 0 };
	const longTasks = { count: 0, totalMs: 0, maxMs: 0 };
	let stage = null;

	const startStage = (name) => {
		stage = { name: String(name), startMs: performance.now(), programMs: 0, glMs: 0 };
		stages.push(stage);
	};
	startStage('Engine start');

	// Names of the #define lines at the top of a shader, where Godot puts a
	// variant's specialization flags, mode, and material flags.
	const topDefines = (source) => {
		const names = [];
		for (const line of source.split(NEWLINE)) {
			if (line.startsWith('#define ')) {
				names.push(line.slice(8).trim().split(' ')[0]);
			} else if (line.startsWith('#if') || line.startsWith('precision')) {
				break;
			}
		}
		return names;
	};

	const hooks = {
		createShader: (gl, args, shader) => {
			records.set(shader, { vertex: args[0] === VERTEX_SHADER, ms: 0, defines: [], glsl3: false, source: '' });
		},
		shaderSource: (gl, args) => {
			const shader = records.get(args[0]);
			if (shader !== undefined) {
				shader.defines = topDefines(args[1]);
				shader.glsl3 = args[1].startsWith('#version 300 es');
				shader.source = keepSource ? args[1] : '';
			}
		},
		createProgram: (gl, args, program) => {
			records.set(program, { ms: 0, shaders: [], draws: 0, stage: '' });
		},
		attachShader: (gl, args) => {
			const program = records.get(args[0]);
			const shader = records.get(args[1]);
			if (program !== undefined && shader !== undefined) {
				program.shaders.push(shader);
			}
		},
		linkProgram: (gl, args) => {
			const program = records.get(args[0]);
			if (program !== undefined) {
				program.stage = stage.name;
				programs.push(program);
				totals.programs += 1;
			}
		},
		useProgram: (gl, args) => {
			gl.startupProfilerProgram = args[0] ? records.get(args[0]) : undefined;
		},
	};
	for (const name of DRAW_CALLS) {
		hooks[name] = (gl) => {
			if (gl.startupProfilerProgram !== undefined) {
				gl.startupProfilerProgram.draws += 1;
			}
		};
	}

	const wrap = (name, original) => {
		const hook = hooks[name];
		const calls = { name: name, count: 0, ms: 0 };
		methods[name] = calls;
		// Binding a program every frame is not part of building it.
		const attribute = name !== 'useProgram';
		return function (...args) {
			const start = performance.now();
			const result = original.apply(this, args);
			const ms = performance.now() - start;
			calls.count += 1;
			calls.ms += ms;
			stage.glMs += ms;
			if (attribute && typeof args[0] === 'object' && args[0] !== null) {
				const record = records.get(args[0]);
				if (record !== undefined) {
					record.ms += ms;
					stage.programMs += ms;
					totals.programMs += ms;
				}
			}
			if (hook !== undefined) {
				hook(this, args, result);
			}
			return result;
		};
	};
	for (const name of Object.getOwnPropertyNames(Gl2.prototype)) {
		const descriptor = Object.getOwnPropertyDescriptor(Gl2.prototype, name);
		if (name !== 'constructor' && descriptor !== undefined && typeof descriptor.value === 'function') {
			Gl2.prototype[name] = wrap(name, descriptor.value);
		}
	}

	try {
		new PerformanceObserver((list) => {
			for (const entry of list.getEntries()) {
				longTasks.count += 1;
				longTasks.totalMs += entry.duration;
				longTasks.maxMs = Math.max(longTasks.maxMs, entry.duration);
			}
		}).observe({ type: 'longtask', buffered: true });
	} catch (error) {
		// Long-task timing is optional; not every browser has it.
	}

	const shaderOf = (program, vertex) => program.shaders.find((shader) => shader.vertex === vertex);
	window.startupProfiler = {
		// Starts a new stage; later WebGL work counts toward it.
		stage: startStage,
		// Program count and compile + link time so far, as JSON.
		summary: () => JSON.stringify(totals),
		// Everything recorded so far, as JSON.
		report: () => JSON.stringify({
			nowMs: performance.now(),
			stages: stages,
			longTasks: longTasks,
			methods: Object.values(methods).filter((calls) => calls.count > 0),
			programs: programs.map((program) => {
				const vertex = shaderOf(program, true);
				const fragment = shaderOf(program, false);
				return {
					stage: program.stage,
					ms: program.shaders.reduce((sum, shader) => sum + shader.ms, program.ms),
					draws: program.draws,
					glsl3: fragment !== undefined && fragment.glsl3,
					defines: fragment !== undefined ? fragment.defines : [],
					vertexSource: keepSource && vertex !== undefined ? vertex.source : undefined,
					fragmentSource: keepSource && fragment !== undefined ? fragment.source : undefined,
				};
			}),
		}),
	};
})();
</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":46820,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
