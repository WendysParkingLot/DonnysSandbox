<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web build</title>
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
	/* iPhone Safari enlarges text in landscape unless told not to. */
	html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
	/* The canvas covers only the visible area (SPEC §3.1): dvh follows Safari's
	   toolbars, where vh would include rows hidden behind them. */
	#render {
		position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh;
		display: block; touch-action: none; outline: none;
	}
	#overlay {
		position: fixed; left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top));
		max-width: calc(100vw - 16px - env(safe-area-inset-left) - env(safe-area-inset-right));
		max-height: calc(100dvh - 16px); overflow: auto; box-sizing: border-box;
		padding: 8px 10px; border-radius: 4px; background: rgba(0, 0, 0, 0.65); color: #fff;
		font: 500 clamp(11px, 1.45vw, 20px)/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
	}
	#overlay .line { white-space: pre-wrap; }
	#overlay .over { color: #ff9e80; }
	/* Controls come first, so a panel taller than a landscape phone screen
	   never pushes them out of reach. */
	#overlay button, #overlay-show { font: inherit; margin: 0 6px 6px 0; padding: 4px 12px; }
	#overlay .hint { margin-top: 6px; opacity: 0.75; font-size: 0.85em; }
	#overlay-show {
		position: fixed; right: max(8px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top));
		margin: 0; opacity: 0.6;
	}
	[hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="render"></canvas>
<div id="overlay"><div id="overlay-buttons"></div><div id="overlay-lines">Loading…</div><div id="overlay-hint" class="hint"></div></div>
<button id="overlay-show" type="button" hidden>Overlay</button>
<script type="module" src="main.js?v=8c70b2b371ea"></script>
</body>
</html>
